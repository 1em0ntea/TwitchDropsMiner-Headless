name: Headless CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    env:
      TDM_DATA_DIR: .tdm-test-data

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile production modules
        run: >-
          python -m compileall -q
          headless
          main_headless.py
          twitch.py
          channel.py
          inventory.py
          websocket.py

      - name: Verify headless core import
        run: |
          python - <<'PY'
          import sys
          import twitch

          assert "gui" not in sys.modules
          assert "tkinter" not in sys.modules
          assert "PIL" not in sys.modules
          print("Headless core imported without desktop modules")
          PY

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript
        run: node --check headless/static/app.js

  container:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag twitchdropsminer-headless:ci .
