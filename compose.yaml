name: twitchdropsminer

services:
  miner:
    image: ${TDM_IMAGE:-twitchdropsminer-headless:local}
    build:
      context: .
      args:
        APP_UID: "10001"
        APP_GID: "10001"
    init: true
    restart: unless-stopped
    user: "10001:10001"
    environment:
      TDM_DATA_DIR: /data
      TDM_WEB_HOST: 0.0.0.0
      TDM_WEB_PORT: "5800"
      TDM_WEB_USERNAME: ${TDM_WEB_USERNAME:-admin}
      TDM_WEB_PASSWORD_FILE: /run/secrets/tdm_web_password
      TDM_WEB_COOKIE_SECURE: ${TDM_WEB_COOKIE_SECURE:-false}
      TDM_WEB_TRUST_PROXY: ${TDM_WEB_TRUST_PROXY:-false}
    secrets:
      - tdm_web_password
    volumes:
      - tdm-data:/data
    ports:
      - "127.0.0.1:${TDM_HOST_PORT:-5800}:5800"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:5800/healthz', timeout=2);
          raise SystemExit(0 if r.status == 200 else 1)
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  tdm_web_password:
    file: ${TDM_WEB_PASSWORD_SOURCE:-./deploy/secrets/web_password}

volumes:
  tdm-data:
